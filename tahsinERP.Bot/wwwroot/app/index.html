<!doctype html>
<html lang="uz">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
    <title>Buyurtma</title>
    <link rel="stylesheet" href="app.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<header class="top">
    <div class="customer">
        <div id="custName" class="cust-name">…</div>
        <div id="custDebt" class="cust-debt"></div>
    </div>
    <div class="tabs">
        <button type="button" class="tab active" data-view="catalog" id="tabCatalog"></button>
        <button type="button" class="tab" data-view="cart" id="tabCart"></button>
    </div>
</header>

<main>
    <section id="viewCatalog">
        <div class="search-row">
            <input id="search" class="search" type="search" autocomplete="off">
            <button type="button" id="scanBtn" class="scan-btn" aria-label="Scan">
                <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M3 5h2v14H3zm4 0h1v14H7zm3 0h2v14h-2zm4 0h1v14h-1zm3 0h2v14h-2zm4 0h1v14h-1z"/></svg>
            </button>
        </div>
        <div id="cats" class="chips"></div>
        <div id="recommended" class="recommended hidden"></div>
        <div id="products" class="list"></div>
        <div id="empty" class="muted center hidden"></div>
    </section>

    <section id="viewCart" class="hidden">
        <div id="cartLines" class="list"></div>
        <div id="cartEmpty" class="muted center hidden"></div>
        <div id="cartForm" class="form">
            <label><span id="lblDate"></span><input id="deliveryDate" type="date"></label>
            <label><span id="lblComment"></span><textarea id="comment" rows="2" maxlength="500"></textarea></label>
            <div class="sign-head"><span id="lblSign"></span><button type="button" id="signClear" class="link"></button></div>
            <canvas id="sign" class="sign" width="600" height="200"></canvas>
            <div class="total"><span id="lblTotal"></span><b id="cartTotal">0</b></div>
            <div id="promoNote" class="muted hidden"></div>
        </div>
    </section>
</main>

<div id="scanner" class="scanner hidden">
    <video id="scanVideo" playsinline muted></video>
    <div class="scan-frame"></div>
    <div class="scan-bar">
        <div id="scanStatus" class="scan-status"></div>
        <button type="button" id="scanClose" class="scan-close"></button>
    </div>
</div>

<div id="toast" class="toast hidden"></div>
<script src="uzcyrl.js"></script>
<script src="scan.js"></script>
<script src="app.js"></script>
</body>
</html>
