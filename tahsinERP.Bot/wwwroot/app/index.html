<!doctype html>
<html lang="uz">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
    <title>Buyurtma</title>
    <link rel="stylesheet" href="app.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<header class="top">
    <div class="customer">
        <div id="custName" class="cust-name">…</div>
        <div id="custDebt" class="cust-debt"></div>
    </div>
    <div class="tabs">
        <button type="button" class="tab active" data-view="catalog" id="tabCatalog"></button>
        <button type="button" class="tab" data-view="cart" id="tabCart"></button>
    </div>
</header>

<main>
    <section id="viewCatalog">
        <input id="search" class="search" type="search" autocomplete="off">
        <div id="cats" class="chips"></div>
        <div id="recommended" class="recommended hidden"></div>
        <div id="products" class="list"></div>
        <div id="empty" class="muted center hidden"></div>
    </section>

    <section id="viewCart" class="hidden">
        <div id="cartLines" class="list"></div>
        <div id="cartEmpty" class="muted center hidden"></div>
        <div id="cartForm" class="form">
            <label><span id="lblDate"></span><input id="deliveryDate" type="date"></label>
            <label><span id="lblComment"></span><textarea id="comment" rows="2" maxlength="500"></textarea></label>
            <div class="sign-head"><span id="lblSign"></span><button type="button" id="signClear" class="link"></button></div>
            <canvas id="sign" class="sign" width="600" height="200"></canvas>
            <div class="total"><span id="lblTotal"></span><b id="cartTotal">0</b></div>
        </div>
    </section>
</main>

<div id="toast" class="toast hidden"></div>
<script src="app.js"></script>
</body>
</html>
