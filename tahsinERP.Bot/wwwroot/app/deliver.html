<!doctype html>
<html lang="uz">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
    <title>Yetkazish</title>
    <link rel="stylesheet" href="app.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<header class="top">
    <div class="customer">
        <div id="custName" class="cust-name">…</div>
        <div id="custInfo" class="cust-debt"></div>
    </div>
</header>

<main>
    <section>
        <div id="lines" class="list"></div>
        <div class="form">
            <label><span id="lblReason"></span><select id="reason"></select></label>
            <label><span id="lblNote"></span><textarea id="note" rows="2" maxlength="300"></textarea></label>
            <div class="sign-head"><span id="lblSign"></span><button type="button" id="signClear" class="link"></button></div>
            <canvas id="sign" class="sign" width="600" height="200"></canvas>
            <div class="total"><span id="lblTotal"></span><b id="total">0</b></div>
            <button type="button" id="refuseBtn" class="link"></button>
        </div>
    </section>
</main>

<div id="toast" class="toast hidden"></div>
<script src="deliver.js"></script>
</body>
</html>
