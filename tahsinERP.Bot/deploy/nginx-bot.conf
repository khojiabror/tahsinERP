# /etc/nginx/sites-available/tahsin-bot — TLS (certbot) bilan. Telegram webhook faqat 443/80/88/8443 portlariga.
server {
    listen 443 ssl http2;
    server_name bot.example.uz;

    ssl_certificate     /etc/letsencrypt/live/bot.example.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bot.example.uz/privkey.pem;

    client_max_body_size 2m;   # webhook update va imzo (PNG) uchun yetarli

    location / {
        proxy_pass         http://127.0.0.1:5190;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}

server {
    listen 80;
    server_name bot.example.uz;
    return 301 https://$host$request_uri;
}
